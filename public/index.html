<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Human Design Chart Generator | Embodiance</title>
<link rel="icon" type="image/png" href="assets/icon-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="title-page landing-hero">
      <img src="assets/logo-horizontal-color.png" alt="Embodiance" class="title-logo" />
      <div class="title-eyebrow">Human Design Report</div>
      <h1 class="report-title">Discover Your Human Design Chart</h1>
      <a href="#birth-form" class="btn-hero-cta">Get Started &darr;</a>
    </div>

    <form id="birth-form">
      <label>
        Name
        <input type="text" id="name" placeholder="For your report header" required />
      </label>
      <label>
        Birth date
        <input type="date" id="date" required />
      </label>
      <label>
        Birth time <span class="hint">(as exact as possible — even a few minutes shifts gates)</span>
        <input type="time" id="time" required step="60" />
      </label>
      <label>
        Place of birth <span class="hint">(the exact city — this determines your timezone)</span>
        <input type="text" id="place-search" placeholder="Type a city, e.g. Singapore" autocomplete="off" />
        <select id="place-select" size="6" style="display:none"></select>
      </label>
      <button type="submit">Generate Chart</button>
    </form>

    <div id="status"></div>
    <div id="result" hidden></div>
  </main>

  <footer class="site-footer">
    <span>embodiance.com</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
